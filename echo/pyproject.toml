[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo"
version = "0.1.0"
description = "echo: the memory organ — chunked machine-listening encoder + vector archive. Answers 'have we heard something like this before?' for novelty search in audio evolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
all = ["scikit-learn>=1.0"]
test = ["pytest>=7"]

[project.scripts]
echo = "echo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"