[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt"
version = "0.1.0"
description = "quilt: the seamstress organ — the corpus chopped into pieces by several scissors, remembered as points in echo's feature space, and sewn back into pieces along chosen paths. No synthesis, no processing: just the original sound, re-ordered."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "echo>=0.1.0", "librosa>=0.10", "soundfile>=0.12"]

[project.scripts]
quilt = "quilt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"