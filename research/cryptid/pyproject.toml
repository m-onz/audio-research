[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptid"
version = "0.1.0"
description = "cryptid: breeding evolved dynamical processes — the sound IS the state, not a designed signal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
all = ["soundfile>=0.12"]
test = ["pytest>=7"]

[project.scripts]
cryptid = "cryptid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
