[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze"
version = "0.1.0"
description = "maze: the audio maze — objective vs drift vs memory. A minimal voice synthesizer bred by four selection policies; the one with echo's archive is the one that goes somewhere."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "echo>=0.1.0"]

[project.scripts]
maze = "maze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"