[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eden"
version = "0.1.0"
description = "eden: a little world of singing agents, heard through a wandering listener. Spatial multi-agent synthesis evolved by echo-driven novelty search — the phenotype is sound over time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "echo>=0.1.0", "maze>=0.1.0"]

[project.scripts]
eden = "eden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"